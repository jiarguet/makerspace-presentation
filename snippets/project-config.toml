# Sample Relevant project configuration for the fictional Godot game "Starside".
# This file wires together the project workspace, resource vault, agent models,
# GTG automation, and the four pipeline roles.

[project]
name = "Starside"
version = "0.1.0"
db_path = "~/.relevant/starside.db"
lancedb_uri = "~/.relevant/starside-lancedb"

# Resource vault entries the personas can search with RAG.
[resources.design_docs]
path = "C:/Games/Starside/design"
type = "design_docs"
watch = true

[resources.epics]
path = "C:/Games/Starside/.relevant/work/epics"
type = "epics"
watch = true

[resources.skills]
path = "C:/Tools/relevant/skills"
type = "skills"
watch = false

[resources.game_repo]
path = "C:/Games/Starside"
type = "game_repo"
watch = true

# Default models for planning + retrieval.
[agent]
default_model = "anthropic/claude-sonnet-4-5"
embedding_model = "ollama/nomic-embed-text"

# GTG controls how often Relevant checks for approved, dependency-unblocked stories.
[gtg]
check_interval_minutes = 5
auto_start_on_gtg = true

# Role definitions map each pipeline stage to a persona + execution harness.
[roles.prompt_writer]
persona = "personas/prompt-writer.md"
model = "claude-sonnet-4.5"
harness = "copilot-cli"
command = "copilot chat --model claude-sonnet-4.5"

[roles.planner]
persona = "personas/planner.md"
model = "claude-opus-4.7"
harness = "copilot-cli"
command = "copilot chat --model claude-opus-4.7"

[roles.executor]
persona = "personas/executor.md"
model = "claude-sonnet-4.5"
harness = "copilot-cli"
command = "copilot chat --model claude-sonnet-4.5"
mcp_servers = ["godot-mcp-pro"]

[roles.tester]
persona = "personas/tester.md"
model = "claude-haiku-4.5"
harness = "copilot-cli"
command = "copilot chat --model claude-haiku-4.5"
